name: InfraPulse CI
on:
  push:
    paths:
      - 'infra-pulse/**'
      - '.github/workflows/infrapulse-ci.yml'
  pull_request:
    paths:
      - 'infra-pulse/**'
      - '.github/workflows/infrapulse-ci.yml'
jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra-pulse
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r backend/requirements.txt pytest
      - run: python -m pytest -q tests
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra-pulse/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npm run build
