x-app: &app
  build: .
  depends_on: {db: {condition: service_healthy}}
services:
  db:
    image: postgres:16-alpine
    environment: {POSTGRES_USER: demo, POSTGRES_PASSWORD: demo, POSTGRES_DB: jobs}
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U demo -d jobs"], interval: 2s, retries: 30}
    volumes: [jobs_db:/var/lib/postgresql/data]
  api:
    <<: *app
    ports: ["8002:8000"]
  worker:
    <<: *app
    command: ["python", "-m", "app.worker"]
    deploy: {replicas: 2}
volumes: {jobs_db: {}}
